<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phishing Email Detection System</title>

  <!-- 🔒 BASIC SECURITY HEADERS -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="no-referrer">

  <!-- 🎨 Main CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- 🌐 Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

  <!-- 🔷 NAVBAR -->
  <div class="navbar">

      <div class="nav-left">
          <strong>🛡 Phishing Detector</strong>
      </div>

      <div class="nav-right">
          <a href="/home">Home</a>
          <a href="/inbox">Inbox</a>
          <a href="/manual">Manual Scan</a>
          <a href="/logout">Logout</a>
      </div>

  </div>


  <!-- 🔔 GLOBAL ALERT (future use) -->
  <div id="global-alert" class="alert-box" style="display:none;"></div>


  <!-- 📦 MAIN CONTENT -->
  <div class="container">

      {% block content %}{% endblock %}

  </div>


  <!-- ⚙ GLOBAL SCRIPT -->
  <script>

  function showAlert(message, type="info"){

      const alertBox = document.getElementById("global-alert");

      alertBox.style.display = "block";
      alertBox.innerText = message;

      if(type === "error"){
          alertBox.style.background = "#ff4d4d";
      }else if(type === "success"){
          alertBox.style.background = "#00cc66";
      }else{
          alertBox.style.background = "#333";
      }

      setTimeout(()=>{
          alertBox.style.display = "none";
      }, 3000);
  }

  </script>

</body>

</html>
