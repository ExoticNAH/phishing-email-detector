{% extends "base.html" %}
{% block content %}

<div class="card">

    <h2>🧪 Quick Email Scan (Dashboard)</h2>

    <p class="subtitle">
        Paste email content to quickly analyze phishing risk using AI.
    </p>

    <textarea
        id="manual-content"
        rows="10"
        placeholder="Paste email content here..."
    ></textarea>

    <div class="action-buttons">
        <button class="btn-primary" id="manual-scan-btn">
            🔍 Run Scan
        </button>
    </div>

    <div id="manual-result" class="scan-box"></div>

</div>


<script>

/* ---------- Extract Links ---------- */
function extractLinks(text){
    return text.match(/https?:\/\/[^\s]+/g) || [];
}


/* ---------- Highlight ---------- */
function highlightContent(text){

    const words = [
        "urgent","verify","password","login","click",
        "account","bank","confirm","security","suspended"
    ];

    let result = text;

    words.forEach(w=>{
        const r = new RegExp(`\\b(${w})\\b`, "gi");
        result = result.replace(r,
            `<span class="phishing-word">$1</span>`);
    });

    result = result.replace(/(https?:\/\/[^\s]+)/g,
        `<span class="phishing-link">$1</span>`);

    return result;
}


/* ---------- Domain Check (fallback if AI not used) ---------- */
function checkDomain(url){
    try{
        const domain = new URL(url).hostname;
        return `✔ ${domain}`;
    }catch{
        return "Invalid URL";
    }
}


/* ---------- SCAN ---------- */

document.getElementById("manual-scan-btn").addEventListener("click", function () {

    const btn = this;
    btn.disabled = true;

    const content = document.getElementById("manual-content").value.trim();
    const box = document.getElementById("manual-result");

    if(!content){
        box.innerHTML = "<p class='error'>⚠ Please enter email content.</p>";
        btn.disabled = false;
        return;
    }

    box.innerHTML = "<p class='loading'>⏳ Running AI scan...</p>";

    fetch("/scan", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "content=" + encodeURIComponent(content)
    })

    .then(res => res.json())

    .then(data => {

        const confidence = Number(data.confidence).toFixed(2);

        /* ---------- LABEL ---------- */
        let labelClass = data.label === "PHISHING"
            ? "label-danger"
            : "label-safe";

        /* ---------- RISKS ---------- */
        let risksHtml = data.risks.map(r => `<li>${r}</li>`).join("");

        /* ---------- LINKS ---------- */
        let links = extractLinks(content);

        let linksHtml = links.map(l =>
            `<li>${l}<br><small>${checkDomain(l)}</small></li>`
        ).join("");

        /* ---------- FORMAT ANALYSIS ---------- */
        let formattedAnalysis = data.analysis
            .replace(/Explanation:/g,"<strong>Explanation:</strong><br>")
            .replace(/Advice:/g,"<br><strong>Advice:</strong><br>")
            .replace(/\n/g,"<br>");

        box.innerHTML = `

            <h3>🧠 Scan Result</h3>

            <p class="result-label ${labelClass}">
                ${data.label}
            </p>

            <p>Confidence: <strong>${confidence}%</strong></p>

            <div class="confidence-bar">
                <div class="confidence-fill"
                style="width:${confidence}%"></div>
            </div>

            <hr>

            <h4>⚠ Detected Risk Factors</h4>

            <ul>
                ${risksHtml || "<li>No significant risk detected</li>"}
            </ul>

            <h4>🔗 Detected Links</h4>

            <ul>
                ${linksHtml || "<li>No links found</li>"}
            </ul>

            <h4>📌 Highlighted Content</h4>

            <div class="highlight-box">
                ${highlightContent(content)}
            </div>

            <hr>

            <h4>📊 AI Analysis</h4>

            <div class="analysis-box">
                ${formattedAnalysis}
            </div>

        `;

    })

    .catch(() => {
        box.innerHTML = "<p class='error'>❌ Scan failed.</p>";
    })

    .finally(() => {
        btn.disabled = false;
    });

});

</script>

{% endblock %}
