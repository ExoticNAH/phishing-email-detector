{% extends "base.html" %}
{% block content %}

<div class="card">

    <h2>🧪 Quick Email Scan (Dashboard)</h2>

    <p class="subtitle">
        Paste email content to quickly analyze phishing risk using AI.
    </p>

    <textarea
        id="manual-content"
        rows="10"
        placeholder="Paste email content here..."
    ></textarea>

    <div class="action-buttons">
        <button class="btn-primary" id="manual-scan-btn">
            🔍 Run Scan
        </button>
    </div>

    <div id="manual-result" class="scan-box"></div>

</div>


<script>

/* ============================= */
/* SAFE ESCAPE */
/* ============================= */
function escapeHTML(text){
    const div = document.createElement("div");
    div.innerText = text;
    return div.innerHTML;
}


/* ============================= */
/* HIGHLIGHT */
/* ============================= */
function highlightContent(text){

    text = escapeHTML(text);

    const words = [
        "urgent","verify","password","login","click",
        "account","bank","confirm","security","suspended",
        "limited","update","immediately","action required"
    ];

    let result = text;

    words.forEach(w=>{
        const r = new RegExp(`(${w})`, "gi");
        result = result.replace(r,
            `<span class="phishing-word">$1</span>`);
    });

    result = result.replace(/(https?:\/\/[^\s]+)/g,
        `<span class="phishing-link" style="word-break:break-all;">$1</span>`);

    result = result.replace(/\n/g,"<br>");

    return result;
}


/* ============================= */
/* EXPLAIN RISK (NEW) */
/* ============================= */
function explainRisk(risk){

    const id = "exp-" + risk.replace(/\s/g,'');
    const container = document.getElementById(id);

    container.innerHTML = "<div class='loading'>⏳ Analyzing...</div>";

    fetch("/explain-risk",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:"risk="+encodeURIComponent(risk)
    })
    .then(res=>res.json())
    .then(data=>{

        let formatted = data.explanation
            .replace(/Explanation:/g,"<strong>Explanation:</strong><br>")
            .replace(/Advice:/g,"<br><strong>Advice:</strong><br>")
            .replace(/\n/g,"<br>");

        container.innerHTML = `
            <div class="analysis-box" style="margin-top:8px;">
                ${formatted}
            </div>
        `;
    });

}


/* ============================= */
/* SCAN */
/* ============================= */

document.getElementById("manual-scan-btn").addEventListener("click", function () {

    const btn = this;
    btn.disabled = true;

    const content = document.getElementById("manual-content").value.trim();
    const box = document.getElementById("manual-result");

    if(!content){
        box.innerHTML = "<p class='error'>⚠ Please enter email content.</p>";
        btn.disabled = false;
        return;
    }

    box.innerHTML = "<p class='loading'>⏳ Running AI scan...</p>";

    fetch("/scan", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "content=" + encodeURIComponent(content)
    })

    .then(res => res.json())

    .then(data => {

        const confidence = Number(data.confidence || 0).toFixed(2);

        let labelClass = data.label === "PHISHING"
            ? "label-danger"
            : "label-safe";

        /* ---------- RISKS ---------- */
        let risksHtml = data.risks && data.risks.length > 0
            ? data.risks.map(r=>{
                const id = r.replace(/\s/g,'');
                return `
                <li class="risk-item">
                    ${r}
                    <button class="explain-btn"
                    onclick="explainRisk('${r}')">Explain</button>
                    <div id="exp-${id}" class="risk-explanation"></div>
                </li>`;
            }).join("")
            : "<li>No significant risk detected</li>";

        /* ---------- DOMAIN ---------- */
        let domainHtml = data.domains && data.domains.length > 0
            ? data.domains.map(d => `
                <li>
                    <strong>${d.domain}</strong><br>
                    <small>${d.analysis.replace(/\n/g,"<br>")}</small>
                </li>
            `).join("")
            : "<li>No domains found</li>";

        /* ---------- ANALYSIS ---------- */
        let formattedAnalysis = data.analysis
            ? data.analysis.replace(/\n/g,"<br>")
            : "No analysis available";

        /* ---------- ADVICE ---------- */
        let formattedAdvice = data.advice
            ? data.advice.replace(/\n/g,"<br>")
            : "No advice available";

        box.innerHTML = `

            <h3>🧠 Scan Result</h3>

            <p class="result-label ${labelClass}">
                ${data.label}
            </p>

            <p class="confidence-text">
                Confidence: <strong>${confidence}%</strong>
            </p>

            <div class="confidence-bar">
                <div class="confidence-fill"
                style="width:${confidence}%"></div>
            </div>

            <hr>

            <h4>⚠ Detected Risk Factors</h4>
            <ul class="risk-list">
                ${risksHtml}
            </ul>

            <h4>🌐 Domain Analysis</h4>
            <ul class="domain-list">
                ${domainHtml}
            </ul>

            <h4>📌 Highlighted Content</h4>
            <div class="highlight-box">
                ${highlightContent(content)}
            </div>

            <hr>

            <h4>📊 AI Analysis</h4>
            <div class="analysis-box">
                ${formattedAnalysis}
            </div>

            <h4>💡 AI Advice</h4>
            <div class="analysis-box">
                ${formattedAdvice}
            </div>

        `;

    })

    .catch(() => {
        box.innerHTML = "<p class='error'>❌ Scan failed.</p>";
    })

    .finally(() => {
        btn.disabled = false;
    });

});

</script>

{% endblock %}
