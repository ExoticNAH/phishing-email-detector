{% extends "base.html" %}
{% block content %}

<div class="card manual-scan-container">

    <h2>🔍 Manual Email Scan</h2>

    <p class="subtitle">
        Paste email content to analyze phishing threats using AI.
    </p>

    <textarea
        id="manual-content"
        rows="10"
        placeholder="Paste email content here..."
        style="width:100%; padding:10px;"
    ></textarea>

    <div class="actions">
        <button class="btn-primary" id="manual-scan-btn">
            🔍 Scan Email
        </button>
    </div>

    <div id="manual-result" class="scan-box"></div>

</div>


<script>

/* ---------- Extract Links ---------- */

function extractLinks(text){
    const regex = /(https?:\/\/[^\s]+)/g;
    return text.match(regex) || [];
}


/* ---------- Highlight Words + Links ---------- */

function highlightContent(text){

    const words = [
        "urgent","verify","password","login",
        "click","account","bank","confirm"
    ];

    let result = text;

    words.forEach(w=>{
        const r = new RegExp(`\\b(${w})\\b`,"gi");
        result = result.replace(r,
        `<span class="phishing-word">$1</span>`);
    });

    // Highlight links
    result = result.replace(/(https?:\/\/[^\s]+)/g,
        `<span class="phishing-link">$1</span>`);

    return result;
}


/* ---------- Detect Suspicious Domain ---------- */

function checkDomain(url){

    try{
        const domain = new URL(url).hostname;

        // simple heuristic
        if(domain.includes("secure") || domain.includes("verify")){
            return `⚠ Suspicious domain: ${domain}`;
        }

        if(domain.replace(/[a-z]/g,'').length > 3){
            return `⚠ Possibly fake domain: ${domain}`;
        }

        return `✔ Domain looks normal: ${domain}`;

    }catch{
        return "Invalid URL";
    }
}


/* ---------- Scan ---------- */

document.getElementById("manual-scan-btn").addEventListener("click", function(){

    const btn = this;
    btn.disabled = true;

    const content = document.getElementById("manual-content").value.trim();
    const box = document.getElementById("manual-result");

    if(!content){
        box.innerHTML = "⚠ Please enter email content";
        btn.disabled = false;
        return;
    }

    box.innerHTML = "⏳ Scanning...";


    fetch("/scan",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"content="+encodeURIComponent(content)
    })

    .then(res=>res.json())

    .then(data=>{

        let links = extractLinks(content);

        let linksHtml = links.map(l=>
            `<li>${l}<br><small>${checkDomain(l)}</small></li>`
        ).join("");

        // Risk Score
        let riskScore = data.label === "PHISHING" ? data.confidence : (100 - data.confidence);

        box.innerHTML = `

        <h3>🧠 AI Result</h3>

        <p style="color:${data.label==="PHISHING"?"red":"green"}">
            <strong>${data.label}</strong>
        </p>

        <p>Confidence: ${data.confidence}%</p>

        <div class="confidence-bar">
            <div class="confidence-fill"
            style="width:${riskScore}%"></div>
        </div>

        <h4>⚠ Risk Factors</h4>
        <ul>
            ${data.risks.join("") || "<li>None</li>"}
        </ul>

        <h4>🔗 Detected Links</h4>
        <ul>
            ${linksHtml || "<li>No links found</li>"}
        </ul>

        <h4>📌 Highlighted Content</h4>
        <div style="white-space:pre-wrap; background:#111; padding:10px;">
            ${highlightContent(content)}
        </div>

        <h4>🤖 AI Analysis</h4>
        <p>${data.analysis}</p>

        `;

    })

    .finally(()=>{
        btn.disabled = false;
    });

});

</script>

{% endblock %}
