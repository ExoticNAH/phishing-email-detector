{% extends "base.html" %} 
{% block content %}

<div class="card inbox-container">

    <!-- HEADER -->
    <div class="inbox-header">

        <!-- LEFT -->
        <div class="header-left">
            <a href="/home" class="btn">← Dashboard</a>
        </div>

        <!-- CENTER -->
        <div class="header-center">
            <h2>📥 Email Inbox</h2>
        </div>

        <!-- RIGHT -->
        <div class="header-right">
            <span class="refresh-indicator">Auto refresh: 15s</span>
        </div>

    </div>

    <!-- EMAIL LIST -->
    <div id="inbox-container">

        {% if emails %}
            {% for email in emails %}

                <div class="email-item clickable"
                     onclick="window.location.href='/email/{{ email.id }}'">

                    <div class="email-left">

                        <div class="email-from">
                            📧 {{ email.from }}
                        </div>

                        <div class="email-subject">
                            {{ email.subject }}
                        </div>

                    </div>

                </div>

            {% endfor %}
        {% else %}

            <p class="empty-inbox">
                No emails found.
            </p>

        {% endif %}

    </div>

</div>


<script>

/* ---------- AUTO REFRESH ---------- */

function refreshInbox(){

    fetch("/inbox")
    .then(res => res.text())
    .then(html => {

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const newInbox = doc.querySelector("#inbox-container");

        if(newInbox){
            document.querySelector("#inbox-container").innerHTML =
                newInbox.innerHTML;
        }

    })
    .catch(err => console.error("Refresh error:", err));
}

/* Refresh every 15 seconds */
setInterval(refreshInbox, 15000);

</script>

{% endblock %}
